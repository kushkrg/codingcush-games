<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Play Vyomastra | CodingCush Games</title>
		<meta name="description" content="Play Vyomastra, a free space shooter, in your browser.">
		<meta name="robots" content="noindex, follow">
		<meta name="theme-color" content="#070b1a">
		<link rel="canonical" href="https://games.codingcush.com/vyomastra/">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #070b1a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
#status { gap: 0; }
#status-splash { position: static; margin: 0; max-width: min(62vw, 300px); max-height: 36vh; height: auto; width: auto; }
#status-progress { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }   /* kept for Godot's script, hidden from view */
#vy-load { display: none; width: min(60vw, 260px); margin-top: 26px; font: 600 11px/1 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; letter-spacing: .28em; color: #8fa3cf; text-align: center; }
#vy-load.on { display: block; }
#vy-track { position: relative; height: 2px; border-radius: 2px; background: rgba(255, 255, 255, .09); }
#vy-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: linear-gradient(90deg, rgba(111, 216, 255, 0), #6fd8ff 55%, #ffffff); box-shadow: 0 0 10px rgba(111, 216, 255, .7); transition: width .25s ease-out; }
/* the bright point at the front of the line: the ship's engine light */
#vy-fill::after { content: ""; position: absolute; right: -3px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px #6fd8ff, 0 0 22px 6px rgba(111, 216, 255, .55); }
#vy-load.wait #vy-fill { width: 28%; animation: vy-sweep 1.5s ease-in-out infinite; transition: none; }
@keyframes vy-sweep { 0% { left: -28%; } 100% { left: 100%; } }
#vy-load.wait #vy-track { overflow: hidden; }
#vy-text { margin-top: 14px; }
#vy-text b { color: #dfe9ff; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { #vy-fill { transition: none; } #vy-load.wait #vy-fill { animation: none; left: 0; width: 100%; opacity: .4; } }

		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="vy-load" class="wait" role="progressbar" aria-label="Loading game" aria-valuemin="0" aria-valuemax="100">
				<div id="vy-track"><div id="vy-fill"></div></div>
				<div id="vy-text">LOADING <b id="vy-pct"></b></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":17925540,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
		<script>
// Mirrors Godot's hidden <progress> onto the custom loading line.
(function () {
	var bar = document.getElementById('status-progress'), box = document.getElementById('vy-load');
	var fill = document.getElementById('vy-fill'), pct = document.getElementById('vy-pct');
	if (!bar || !box) { return; }
	function sync() {
		if (!document.body.contains(box)) { return; }            // overlay removed: the game has started
		box.classList.toggle('on', bar.style.display !== 'none');
		var known = bar.hasAttribute('value') && bar.max > 0;
		box.classList.toggle('wait', !known);
		if (known) {
			var p = Math.max(0, Math.min(100, Math.round(bar.value / bar.max * 100)));
			fill.style.width = p + '%'; pct.textContent = p + '%'; box.setAttribute('aria-valuenow', p);
		} else {
			fill.style.width = ''; pct.textContent = ''; box.removeAttribute('aria-valuenow');
		}
		requestAnimationFrame(sync);
	}
	sync();
})();
		</script>

	</body>
</html>
