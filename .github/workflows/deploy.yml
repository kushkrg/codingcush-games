name: Deploy to games.codingcush.com

# Uploads the site to Hostinger over FTPS on every push to main.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    the FTP hostname or IP shown in hPanel > Files > FTP Accounts
#   FTP_USERNAME  an FTP account whose folder is the games subdomain folder
#   FTP_PASSWORD  that account's password
# Until the secrets exist the job does nothing and still passes.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the FTP secrets are set
        id: secrets
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::notice::FTP secrets are not set yet, so nothing was uploaded."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Upload changed files
        if: steps.secrets.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          # Never upload repository-only files, and never touch the server's own config.php.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            _src/**
            README.md
            api/config.php
